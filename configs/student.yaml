seed: 289

device: auto
torch_num_threads: 8

model:
  hidden_dim: 50
  num_layers: 5
  use_gru: false

training:
  batch_size: 256
  updates: 50000
  smoke_updates: 120
  train_sequence_length: 96
  learning_rate: 1e-3
  grad_clip_norm: 2.0
  eval_every: 500
  smoke_eval_every: 20
  val_horizon: 300
  max_val_windows: 256
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 0.00
  rollout_train_horizon: 40
  multi_rollout_horizons: [10, 20, 40]
  rollout_loss_type: huber
  huber_beta: 0.5
  vpt_surrogate_weight: 0.0
  vpt_surrogate_horizon: 40
  vpt_threshold: 0.25
  vpt_percentile: 0.80
  vpt_margin: 0.05
  vpt_surrogate_schedule:
    enabled: false
    start_after_updates: 980000
    ramp_updates: 5000
    weight_start: 0.01
    weight_end: 1
  curriculum:
    enabled: false
    start_after_updates: 10000
    ramp_updates: 0
    one_step_weight_start: 1.0
    one_step_weight_end: 1.0
    rollout_weight_pre_start: 0.00
    rollout_weight_start: 0.05
    rollout_weight_end: 0.05
    rollout_weight_start_after_updates: 10000
    rollout_weight_ramp_updates: 0
    rollout_horizon_start: 20
    rollout_horizon_end: 40
    rollout_horizon_start_after_updates: 10000
    rollout_horizon_ramp_updates: 10000

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
