seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 64
  num_layers: 2
  use_gru: false

training:
  batch_size: 256
  updates: 12000
  smoke_updates: 120
  train_sequence_length: 96
  learning_rate: 4e-3
  grad_clip_norm: 10.0
  eval_every: 200
  smoke_eval_every: 20
  val_horizon: 300
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 1.5
  rollout_train_horizon: 30
  rollout_loss_type: huber
  huber_beta: 1.0
  multi_rollout_horizons: [5, 15]
  curriculum:
    enabled: true
    start_after_updates: 3000
    ramp_updates: 6000
    one_step_weight_start: 1.2
    one_step_weight_end: 0.6
    rollout_weight_start: 0.3
    rollout_weight_end: 1.5
    rollout_horizon_start: 5
    rollout_horizon_end: 35

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
