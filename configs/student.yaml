seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 50
  num_layers: 10
  use_gru: false

training:
  batch_size: 1000
  updates: 200000
  smoke_updates: 120
  train_sequence_length: 96
  learning_rate: 0.3e-3
  grad_clip_norm: 10.0
  eval_every: 200
  smoke_eval_every: 20
  val_horizon: 300
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 0.01
  rollout_train_horizon: 20
  multi_rollout_horizons: [5, 15]
  rollout_loss_type: huber
  huber_beta: 1.0
  vpt_surrogate_weight: 0.0
  vpt_surrogate_horizon: 40
  vpt_threshold: 0.25
  vpt_percentile: 0.80
  vpt_margin: 0.05
  vpt_surrogate_schedule:
    enabled: false
    start_after_updates: 100000
    ramp_updates: 70000
    weight_start: 0.01
    weight_end: 0.1
  curriculum:
    enabled: true
    start_after_updates: 100000
    ramp_updates: 70000
    one_step_weight_start: 1.0
    one_step_weight_end: 1.0
    rollout_weight_pre_start: 0.000001
    rollout_weight_start: 0.000001
    rollout_weight_end: 0.0001
    rollout_weight_start_after_updates: 100000
    rollout_weight_ramp_updates: 70000
    rollout_horizon_start: 10
    rollout_horizon_end: 45
    rollout_horizon_start_after_updates: 0
    rollout_horizon_ramp_updates: 150000

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
